name: Build with DotNet

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Restore packages
      shell: powershell
      run: |
        dotnet restore SecureDesktop.sln --verbosity minimal
        Write-Host "Restore exit code: $LASTEXITCODE"
        
    - name: Build solution
      shell: powershell
      run: |
        dotnet build SecureDesktop.sln --configuration Release --verbosity minimal
        Write-Host "Build exit code: $LASTEXITCODE"
        
    - name: Find EXE
      shell: powershell
      run: |
        Get-ChildItem -Path . -Recurse -Filter "SecureDesktop.exe" | Select-Object FullName, Length
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-Release
        path: |
          **/bin/Release/**/SecureDesktop.exe
          **/bin/Release/**/*.dll
        retention-days: 30