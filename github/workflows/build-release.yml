name: Build and Release SecureDesktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      shell: cmd
      run: |
        nuget restore SecureDesktop.sln -Verbosity quiet
        exit 0
      
    - name: Build solution
      shell: cmd
      run: |
        msbuild SecureDesktop.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /v:minimal /p:TreatWarningsAsErrors=false
      
    - name: Prepare artifacts
      shell: cmd
      run: |
        if not exist publish mkdir publish
        xcopy "src\SecureDesktop\bin\Release\*.exe" publish\ /Y /I
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-Release
        path: publish\*.exe
        retention-days: 30