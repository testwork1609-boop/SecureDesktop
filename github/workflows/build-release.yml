name: Build SecureDesktop

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build with MSBuild
      shell: powershell
      run: |
        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild SecureDesktop.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=true /v:q
        Write-Host "Build finished"
    
    - name: Show results
      shell: powershell
      run: |
        Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "SecureDesktop*"}
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-App
        path: |
          src/SecureDesktop/bin/Release/SecureDesktop.exe
          src/SecureDesktop/bin/Release/*.dll