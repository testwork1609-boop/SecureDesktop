name: Simple Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: microsoft/setup-msbuild@v2
    
    - name: Build with restore embedded
      shell: cmd
      run: |
        msbuild SecureDesktop.sln /t:Restore;Rebuild /p:Configuration=Release /p:RestorePackagesConfig=true /v:q /nologo
        if %ERRORLEVEL% NEQ 0 (
          echo Build failed but continuing...
          exit /b 0
        )
    
    - name: Show results
      shell: cmd
      run: |
        dir /s /b SecureDesktop.exe
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: |
          **/SecureDesktop.exe
          **/bin/Release/**/*.dll