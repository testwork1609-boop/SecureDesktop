name: Build and Release SecureDesktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore SecureDesktop.sln -Verbosity quiet
      continue-on-error: true

    - name: Build solution
      run: |
        msbuild SecureDesktop.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /v:minimal /p:WarningLevel=0

    - name: Prepare artifacts
      run: |
        if not exist publish mkdir publish
        xcopy "src\SecureDesktop\bin\Release\*.exe" publish\ /Y
      continue-on-error: true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-Release
        path: publish\*.exe
        retention-days: 30