name: Debug Build

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: List files
      run: |
        echo "=== Project structure ==="
        dir /s /b *.csproj
        dir /s /b *.sln
        echo "=== .NET version ==="
        dotnet --version

    - name: Restore with details
      run: |
        nuget restore SecureDesktop.sln -Verbosity detailed 2>&1 | tee restore-log.txt

    - name: Upload restore log
      uses: actions/upload-artifact@v4
      with:
        name: restore-log
        path: restore-log.txt

    - name: Build with diagnostics
      run: |
        msbuild SecureDesktop.sln /p:Configuration=Release /t:Rebuild /v:diagnostic 2>&1 | tee build-log.txt
      continue-on-error: true

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-log.txt