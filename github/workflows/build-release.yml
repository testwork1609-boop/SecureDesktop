name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build everything in one step
      shell: cmd
      run: |
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" SecureDesktop.sln /t:Restore;Build /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop
        path: src/SecureDesktop/bin/Release/SecureDesktop.exe