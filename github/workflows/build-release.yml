name: Build SecureDesktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore packages
      run: nuget restore SecureDesktop.sln

    - name: Build
      run: msbuild SecureDesktop.sln /p:Configuration=Release

    - name: Publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop
        path: src\SecureDesktop\bin\Release\*.exe