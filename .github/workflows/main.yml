name: Build Single EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build SINGLE EXE
      shell: cmd
      run: |
        echo ========================================
        echo  BUDOWANIE JEDNEGO PLIKU EXE
        echo ========================================
        msbuild SecureDesktop.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /restore /v:minimal /nologo

    - name: Verify EXE
      shell: cmd
      run: |
        echo Sprawdzanie pliku EXE...
        dir src\SecureDesktop\bin\Release\SecureDesktop.exe
        for %%A in (src\SecureDesktop\bin\Release\SecureDesktop.exe) do echo Rozmiar: %%~zA bajtow

    - name: Sign EXE
      shell: powershell
      run: |
        Write-Host "Podpisywanie cyfrowe EXE..."
        $cert = New-SelfSignedCertificate -Subject "CN=SecureDesktop" -Type CodeSigningCert -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
        $exePath = "src\SecureDesktop\bin\Release\SecureDesktop.exe"
        if (Test-Path $exePath) {
            Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            Write-Host "EXE podpisany cyfrowo"
        }
        else {
            Write-Host "Nie znaleziono pliku EXE"
        }

    - name: Prepare artifact
      shell: cmd
      run: |
        if not exist publish mkdir publish
        copy src\SecureDesktop\bin\Release\SecureDesktop.exe publish\
        echo JEDEN PLIK EXE - dziala od razu! > publish\README.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-SingleEXE
        path: publish\
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        name: "SecureDesktop v1.0.${{ github.run_number }}"
        tag_name: "v1.0.${{ github.run_number }}"
        body: "SecureDesktop - JEDEN PLIK EXE - Gotowy do uzycia"
        files: publish\SecureDesktop.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}