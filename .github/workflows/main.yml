name: Build and Release SecureDesktop

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore SecureDesktop.sln

    - name: Build solution
      run: |
        msbuild SecureDesktop.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild

    - name: Prepare artifacts
      run: |
        mkdir publish
        copy src\SecureDesktop\bin\Release\SecureDesktop.exe publish\
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-Release
        path: publish\SecureDesktop.exe
