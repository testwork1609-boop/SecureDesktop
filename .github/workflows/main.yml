name: Build Single EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet
      shell: cmd
      run: msbuild SecureDesktop.sln /t:Restore /p:Configuration=Release /v:minimal

    - name: Build application (32-bit compatible)
      shell: cmd
      run: |
        echo ========================================
        echo  BUDOWANIE APLIKACJI (32/64-bit)
        echo ========================================
        msbuild SecureDesktop.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /nologo

    - name: Verify build output
      shell: cmd
      run: |
        echo Pliki po buildzie:
        dir src\SecureDesktop\bin\Release\*.exe
        dir src\SecureDesktop\bin\Release\*.dll

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-32bit-Compatible
        path: |
          src\SecureDesktop\bin\Release\*.exe
          src\SecureDesktop\bin\Release\*.dll
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        name: "SecureDesktop v1.0.${{ github.run_number }}"
        tag_name: "v1.0.${{ github.run_number }}"
        body: |
          ## 🔒 SecureDesktop
          
          ✅ Działa na Windows 10/11 **32-bit i 64-bit**
          ✅ Wymaga .NET Framework 4.8
          
          **Logowanie:** admin / admin
        files: |
          src\SecureDesktop\bin\Release\*.exe
          src\SecureDesktop\bin\Release\*.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
