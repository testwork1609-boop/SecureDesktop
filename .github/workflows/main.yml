name: Build SecureDesktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with restore
      shell: cmd
      run: |
        msbuild SecureDesktop.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /restore /v:minimal /nologo

    - name: Check if EXE exists
      shell: cmd
      run: |
        dir /s /b SecureDesktop.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-App
        path: src\SecureDesktop\bin\Release\SecureDesktop.exe
        retention-days: 30

            - name: Sign EXE (self-signed)
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -Subject "CN=SecureDesktop" -Type CodeSigningCert -CertStoreLocation Cert:\CurrentUser\My
        $path = "src\SecureDesktop\bin\Release\SecureDesktop.exe"
        Set-AuthenticodeSignature -FilePath $path -Certificate $cert