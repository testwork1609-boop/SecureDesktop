name: Build Single EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet
      shell: cmd
      run: nuget restore SecureDesktop.sln

    - name: Build application (x86)
      shell: cmd
      run: |
        echo ========================================
        echo  BUDOWANIE APLIKACJI x86 (32-bit)
        echo ========================================
        msbuild SecureDesktop.sln /t:Build /p:Configuration=Release /p:Platform="x86" /restore /v:minimal /nologo

    - name: Verify build output
      shell: cmd
      run: |
        echo Pliki po buildzie:
        dir src\SecureDesktop\bin\Release\*.exe
        dir src\SecureDesktop\bin\Release\*.dll

    - name: Upload artifact (x86)
      uses: actions/upload-artifact@v4
      with:
        name: SecureDesktop-x86-32bit
        path: |
          src\SecureDesktop\bin\Release\SecureDesktop.exe
          src\SecureDesktop\bin\Release\Newtonsoft.Json.dll
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        name: "SecureDesktop v1.0.${{ github.run_number }} - 32-bit"
        tag_name: "v1.0.${{ github.run_number }}"
        body: |
          ## 🔒 SecureDesktop - Wersja 32-bit (x86)
          
          ✅ Działa na Windows 10/11 **32-bit i 64-bit**
          ✅ Wymaga .NET Framework 4.8
          
          **Instalacja:**
          1. Pobierz pliki
          2. Umieść w folderze
          3. Utwórz podfoldery: Database, Backup, Logs
          4. Uruchom SecureDesktop.exe
          
          **Logowanie:** admin / admin
        files: |
          src\SecureDesktop\bin\Release\SecureDesktop.exe
          src\SecureDesktop\bin\Release\Newtonsoft.Json.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}